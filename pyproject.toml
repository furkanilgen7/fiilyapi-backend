[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "fiil-erp-backend"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "sqlalchemy>=2.0.36",
    "greenlet>=3.1",
    "asyncpg>=0.30",
    "alembic>=1.14",
    "pydantic[email]>=2.10",
    "pydantic-settings>=2.7",
    "argon2-cffi>=23.1",
    "pyjwt>=2.10",
    "slowapi>=0.1.9",
    "python-multipart>=0.0.20",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.25",
    "pytest-cov>=6.0",
    "httpx>=0.28",
    "ruff>=0.8",
]

# setuptools'un duz-yerlesim (flat-layout) otomatik kesfi kok dizinde hem `app` hem
# `alembic` gorunce "Multiple top-level packages discovered" hatasiyla duser ve CI'daki
# `pip install -e .[dev]` adimini kirar. Paket yalnizca `app` ve alt paketleridir;
# `alembic/` bir paket degil, calisma dizininden kosulan migration betikleridir
# (Dockerfile da onu ayrica COPY eder, kurulumdan beklemez).
[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
testpaths = ["tests"]

[tool.coverage.run]
source = ["app"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
# UP042: StrEnum onerisini kasitli olarak yok sayiyoruz. Proje genelinde
# (str, enum.Enum) deseni bilinclidir; StrEnum'a gecis __str__ davranisini
# degistirir ((str, Enum) -> "UserStatus.active", StrEnum -> "active") ve bu,
# ortuk string donusumlerini sessizce bozar. Desen AccessLevel, Scope,
# ModuleGroup gibi diger enum siniflarinda da spec geregi tekrarlanacak.
ignore = ["UP042"]
