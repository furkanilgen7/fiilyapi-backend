[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "fiil-erp-backend"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    # 🔴 SOZLESMEYI URETEN KUTUPHANELER TAM SURUMLE PINLIDIR (TB-PIN, 2026-08-25).
    # `openapi.json` bu kutuphanelerin YORUMLAYICI DAVRANISININ ciktisidir, kodun degil:
    # aralik birakildiginda CI ve Docker her kosuda PyPI'daki en yeni surumu cozer ve tek
    # satir kod degismeden sozlesme kayar. Frontend tiplerini (`schema.d.ts`) bu sozlesmeden
    # urettigi icin sessizce bayatlar. Olculdu: pydantic 2.11.10 -> 2.12+ gecisinde `Decimal`
    # alanlari `pattern` kazaniyor (5 -> 643 alan), 554 semanin buyuk bolumu degisiyor.
    # Surumler CANLIDA KOSANA gore secildi (canli /openapi.json ile kanonik md5 birebir).
    # Bekcisi: tests/contract/test_openapi_contract_baseline.py
    # Ayni gerekce `ruff==0.15.22` pininin gerekcesiyle ayni siniftan: uretilen artefakt
    # arac surumune baglidir, koda degil.
    "fastapi==0.141.1",
    # starlette fastapi'nin gecisli bagimliligidir ama yollari/operasyonlari O uretir;
    # fastapi pinliyken bile aralikta kalirsa sozlesme kayabilir.
    "starlette==1.6.0",
    "uvicorn[standard]==0.52.4",
    "sqlalchemy==2.0.52",
    "greenlet>=3.1",
    "asyncpg>=0.30",
    "alembic==1.19.1",
    "pydantic[email]==2.13.4",
    "pydantic-settings==2.15.0",
    # 🔴 PAROLA MALIYET PARAMETRELERINI URETEN KUTUPHANE PINLI (SEC-ARGON, 2026-08-25).
    # `PasswordHasher`in VARSAYILAN time_cost/memory_cost/parallelism degerleri surumle
    # degisebilir; aralik birakildiginda o gunden sonraki parolalar sessizce BASKA
    # maliyetle hash'lenir ve argon2 ozeti self-describing oldugu icin eskiler
    # dogrulanmaya devam eder → hicbir test kirilmaz, hicbir uyari cikmaz.
    # Surum CANLIDA KOSANA gore donduruldu, yukseltme YAPILMADI: `>=23.1` kisiti
    # 2025-06-03'ten (25.1.0 yayimi) beri her kurulumda 25.1.0 coziyor, son deploy
    # 2026-08-25 → canli 25.1.0 kosuyor. 23.1.0 ile 25.1.0'in varsayilanlari OLCULDU
    # ve OZDES (t=3, m=65536, p=4) → veritabanindaki mevcut ozetler tek nesildir.
    # Bekcisi: tests/core/test_argon2_parametreleri.py (pin ↔ KURULU surum + uretilen ozet)
    "argon2-cffi==25.1.0",
    # argon2-cffi-bindings, argon2-cffi'nin GECISLI bagimliligidir ama parola ozetini
    # fiilen URETEN katman odur (`starlette` ↔ `fastapi` emsali). Aralikta birakilmasinin
    # zarari HIPOTETIK DEGIL, OLCULDU: 26.1.0 **2026-08-20**'de cikti ve 2026-08-25 TB-PIN
    # deploy'u `requirements.txt`i degistirip Docker katman onbellegini dusurunce canli
    # imaj sessizce 25.1.0 → 26.1.0'a tasindi. Surum CANLIDA KOSANA gore donduruldu;
    # canli build log'undan DOGRUDAN okundu (`railway logs --build --service
    # fiilyapi-backend` → "Successfully installed ... argon2-cffi-bindings-26.1.0").
    # 25.1.0 ↔ 26.1.0 ayni parametrelerle BAYT-AYNI ozet uretiyor (olculdu) — yani bugun
    # zarar yok; pin tam olarak "bugun zarar yok, yarin sessizce degisir" icin var.
    "argon2-cffi-bindings==26.1.0",
    "pyjwt>=2.10",
    "slowapi>=0.1.9",
    "python-multipart>=0.0.20",
    "openpyxl>=3.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.25",
    "pytest-cov>=6.0",
    # Tam kume TEK cekirdekte 24 dk 24 sn suruyordu (CI turu, PR #80 `test` isi; 6144 test).
    # xdist testleri N ayri SURECE dagitir. Yalitim: her isci KENDI veritabanini alir
    # (`tests/conftest.py` -> `PYTEST_XDIST_WORKER` son eki); paylasilan tek DB'de
    # kosmak sahte kirmizi VE sahte yesil uretirdi.
    "pytest-xdist>=3.6",
    "httpx>=0.28",
    # Sabit surum: ruff'un bicimlendirici davranisi surumler arasinda degisiyor.
    # Araligi acik birakmak (>=0.8) CI'nin her kosuda en yeni surumu kurmasina ve
    # lokalde temiz olan agacin CI'da "yeniden bicimlendirilmeli" demesine yol aciyordu.
    "ruff==0.15.22",
]

# setuptools'un duz-yerlesim (flat-layout) otomatik kesfi kok dizinde hem `app` hem
# `alembic` gorunce "Multiple top-level packages discovered" hatasiyla duser ve CI'daki
# `pip install -e .[dev]` adimini kirar. Paket yalnizca `app` ve alt paketleridir;
# `alembic/` bir paket degil, calisma dizininden kosulan migration betikleridir
# (Dockerfile da onu ayrica COPY eder, kurulumdan beklemez).
[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
testpaths = ["tests"]
# 🔴 `-n` BURAYA YAZILMAZ (TB-XDIST, 2026-08-25) — ve `-n auto` HIC KULLANILMAZ.
# Gerekce iki katmanli:
#   (a) `addopts`a konsaydi HEDEFLI kosu da (tek dosya, mutasyon turu) 4 surec acar,
#       her biri kendi veritabanini kurup dusururdu -> tek dosyalik tur YAVASLARDI.
#       Paralellik TAM KUMENIN sorunudur; hedefli kosu zaten saniyeler suruyor.
#   (b) `auto` bu makinede 8 isci acar; makine 8 CEKIRDEK ama 8 GB RAM'dir ve swap'e
#       dusen kosu SERI kosudan YAVASTIR. Ust sinir 4'tur (kullanici karari); ayrica
#       bu depoda paralel frontend hatti kosar.
# Tam kume icin komut README "Test ve linter" bolumundedir (`-n 4 --dist loadfile`).

[tool.coverage.run]
source = ["app"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
# UP042: StrEnum onerisini kasitli olarak yok sayiyoruz. Proje genelinde
# (str, enum.Enum) deseni bilinclidir; StrEnum'a gecis __str__ davranisini
# degistirir ((str, Enum) -> "UserStatus.active", StrEnum -> "active") ve bu,
# ortuk string donusumlerini sessizce bozar. Desen AccessLevel, Scope,
# ModuleGroup gibi diger enum siniflarinda da spec geregi tekrarlanacak.
ignore = ["UP042"]
